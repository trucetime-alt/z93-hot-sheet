<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Z93 Hot Sheet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0b0d10; --panel:#151a20; --panel2:#1d242c; --line:#2c3640;
  --text:#f2f4f6; --dim:#a9b4bf; --accent:#ffcc33; --accent2:#33d6ff;
  --warn:#ff5a3c; --ok:#3ddc84; --fs:20px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--line);background:var(--panel2);border-radius:14px;
  min-height:52px;padding:8px 16px;font-weight:700}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent2)}
#top{position:relative;z-index:10;background:var(--bg);padding:max(8px,env(safe-area-inset-top)) 10px 0}
#top.pinned{position:sticky;top:var(--bH,0px)}
body.flown #top{padding-top:0}
#tabsBar{position:sticky;top:calc(var(--bH,0px) + var(--pinH,0px));z-index:9;background:var(--bg);border-bottom:2px solid var(--line);padding:0 10px 6px}
#spBanner{position:sticky;top:0;z-index:12}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.04em;color:var(--accent);font-size:1.05em;flex:0 0 auto}
#top>.row:first-child{flex-wrap:nowrap}
#daysRow{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:6px}
#dowLabel{flex:0 0 auto;font-weight:900;font-size:.8em;color:#fff;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:4px 8px;white-space:nowrap}
#dayChips{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
#dayChips::-webkit-scrollbar{display:none}
.daychip{flex:0 0 auto;min-height:40px;max-width:24em;padding:4px 10px;border-radius:10px;font-size:.78em;font-weight:800;
  background:#1b1430;border:2px solid #5b3fa8;color:#efe7ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daychip.k-federal{background:#10213d;border-color:#3d7bd9}
.daychip.k-un{background:#0b2a33;border-color:#2aa7c9}
#dayModal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:none;align-items:flex-start;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 10px 10px;overflow-y:auto}
#dayModal.on{display:flex}
#dayModal .box{background:var(--panel);border:2px solid var(--line);border-radius:16px;max-width:640px;width:100%;padding:14px}
#dayModal h3{margin:0 0 8px;color:var(--accent);font-size:1.15em}
.daycard{border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--bg)}
.daycard.hit{border-color:var(--accent)}
.daycard .nm{font-weight:900;font-size:1.1em}
.daycard .kd{display:inline-block;font-size:.65em;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--dim);margin:4px 0}
.daycard .lab{font-size:.7em;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:8px}
.daycard p{margin:2px 0}
.daycard .angle{color:var(--accent)}
.daycard .src{font-size:.75em;color:var(--dim);margin-top:8px}
#dayModal .close{width:100%;margin-top:6px}
#clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05em}
/* weather bar */
#wx{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:8px}
#wx .temp{font-size:2.2em;font-weight:900;line-height:1;padding:6px 12px;background:var(--panel);
  border-radius:14px;display:flex;align-items:center}
#wx .meta{flex:1 1 220px;background:var(--panel);border-radius:14px;padding:6px 12px;min-width:0}
#wx .cond{font-weight:800;font-size:1.1em}
#wx .small{color:var(--dim);font-size:.8em}
#adv{width:100%;border-radius:14px;padding:8px 12px;font-weight:800;display:none}
#adv.on{display:block;background:var(--warn);color:#fff}
#adv.past{display:block;background:transparent;color:var(--dim);border:1px dashed var(--line);font-size:.7em;font-weight:600;padding:4px 10px}
#traffic{width:100%;border-radius:14px;padding:6px 12px;background:#2a2410;color:var(--accent);font-weight:700}
#traffic:empty{display:none}
/* controls */
#controls{margin:8px 0 2px}
#controls button{min-width:52px}
#dateLabel{font-weight:800;min-width:9em;text-align:center}
.sheettag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:8px;font-size:.75em;font-weight:800;color:var(--dim);border:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.sheettag.old{color:#1a1200;background:#ffb020;border-color:#ffb020}
#dayChips .forday{font-size:.7em;color:var(--dim);font-weight:800;align-self:center;white-space:nowrap}
#datePick{background:var(--panel2);border:2px solid var(--line);border-radius:14px;min-height:52px;padding:4px 10px;
  color-scheme:dark}
/* tabs */
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:thin}
#tabs button{flex:0 0 auto;white-space:nowrap}
#tabs button[aria-selected="true"]{background:var(--accent);color:#111;border-color:var(--accent)}
#tabs button .cat{display:block;font-size:.6em;font-weight:600;opacity:.8;line-height:1}
#tabs button.empty{opacity:.5}
main{padding:12px 12px 120px;max-width:980px;margin:0 auto}
#status{padding:10px 14px;border-radius:14px;background:var(--panel);margin-bottom:12px;display:none}
#status.show{display:block}
#status.err{background:#3a1410;border:2px solid var(--warn)}
.sec h2{margin:.2em 0;font-size:1.35em;color:var(--accent)}
.sec .catline{color:var(--dim);font-weight:700;font-size:.8em;text-transform:uppercase;letter-spacing:.08em}
.content{white-space:pre-wrap;word-wrap:break-word;background:var(--panel);border-radius:16px;
  padding:14px 16px;margin:10px 0;font-size:1.05em}
.content.empty{color:var(--dim);font-style:italic}
details.notes{background:var(--panel);border-radius:14px;margin:10px 0;border:1px solid var(--line)}
details.notes summary{padding:12px 16px;font-weight:700;color:var(--dim);cursor:pointer;min-height:48px}
details.notes div{white-space:pre-wrap;word-wrap:break-word;padding:0 16px 14px;color:var(--dim);font-size:.85em}
/* audio */
.player{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.player .ptitle{font-weight:800;margin-bottom:6px}
.player .pnote{color:var(--dim);font-size:.75em;margin-top:6px}
.player .prow{display:flex;gap:10px;align-items:center}
.player .pp{width:72px;height:72px;border-radius:50%;font-size:1.8em;background:var(--ok);color:#06210f;border:none;flex:0 0 auto}
.player.playing .pp{background:var(--warn);color:#fff}
.player .bar{flex:1;min-width:0}
.player input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
.player .time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:.85em}
.player .stop{min-width:60px}
.loadclips{width:100%;background:var(--accent2);color:#04222b;border-color:var(--accent2);font-size:1.05em;min-height:64px}
#drop{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;
  font-size:1.6em;font-weight:900;color:var(--accent);z-index:50;border:6px dashed var(--accent)}
#drop.on{display:flex}
.hint{color:var(--dim);font-size:.8em}
/* weather icon, week strip, radar */
#wx .temp{gap:6px}
#wxIcon{display:inline-flex;width:1.25em;height:1.25em}
#wxIcon svg,.wk svg{width:100%;height:100%}
#wxGrid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:6px}
#wxCol{min-width:0}
#todayWx{display:flex;margin-top:6px}
#todayBtn{flex:1;min-height:48px;display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--panel);border:2px solid var(--line);border-radius:12px;text-align:left;font-size:.95em}
#todayBtn .i{width:34px;height:34px;flex:0 0 auto;display:inline-flex}#todayBtn .i svg{width:100%;height:100%}
#todayBtn .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#todayBtn .hl{font-weight:900}#todayBtn .hl .lo{color:#7fb6ff;font-weight:700}
#todayBtn .sf{color:var(--dim);font-weight:700}
#todayBtn .arr{flex:0 0 auto;font-size:1.25em;font-weight:900;color:var(--accent2);width:1.4em;text-align:center}
#todayBtn[aria-expanded=true]{border-color:var(--accent2)}
#radarThumb{display:block;width:100%;min-height:0;padding:0;overflow:hidden;position:relative;background:#111;border-radius:12px;border:2px solid var(--line)}
.rmap{position:relative;overflow:hidden;width:100%;aspect-ratio:4/3;background:#1d1d20}
.rin{position:absolute;left:0;width:100%;aspect-ratio:900/846;top:50%;transform:translateY(-50%)}
.rin img{position:absolute;inset:0;width:100%;height:100%;display:block}
.rin img.fr{visibility:hidden}.rin img.fr.on{visibility:visible}
.tvc{position:absolute;left:64.84%;top:52.6%;transform:translate(-50%,-50%);pointer-events:none}
.tvc i{display:block;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.tvc b{position:absolute;left:14px;top:-5px;font-size:12px;font-weight:900;color:#fff;background:rgba(0,0,0,.7);padding:0 4px;border-radius:4px;white-space:nowrap}
.rfb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:28% 45%;display:none}
#radarThumb .lbl{display:block;text-align:left;font-size:.7em;font-weight:900;background:#000;padding:3px 10px;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#radarThumb .lbl.stale{color:var(--warn)}
#radarThumb .exp{position:absolute;right:6px;top:6px;font-size:.7em;font-weight:900;background:rgba(0,0,0,.7);padding:2px 7px;border-radius:6px;color:#fff}
#radarThumb .off{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:.8em;color:var(--dim);text-align:center}
#radarThumb.fallback .rin{display:none}#radarThumb.fallback .rfb{display:block}
#radarThumb.offline .rin,#radarThumb.offline .rfb{visibility:hidden}#radarThumb.offline .off{display:flex}
@media (min-width:900px){ #wxGrid{grid-template-columns:minmax(0,1fr) 460px;align-items:start} }
@media (min-width:521px) and (max-width:899px){ #radarThumb{max-width:620px;margin:0 auto} }
@media (max-height:500px) and (orientation:landscape){ #wxGrid{grid-template-columns:minmax(0,1fr) 40vw;align-items:start} }
#week{display:flex;gap:4px;overflow-x:auto;background:var(--panel);border-radius:12px;padding:4px;scrollbar-width:none;margin-top:6px}
#week[hidden]{display:none}
#week::-webkit-scrollbar{display:none}
.wk{flex:1 0 58px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 2px;border-radius:9px;line-height:1.1}
.wk .d{font-size:.66em;font-weight:900;color:var(--dim);text-transform:uppercase}
.wk .i{width:30px;height:30px;margin:2px 0}
.wk .t{font-weight:900;font-size:.85em;white-space:nowrap}.wk .t .lo{color:#7fb6ff;font-weight:700}
.wk .p{font-size:.55em;color:#7fb6ff;min-height:1em}
#weekSrc{font-size:.6em;color:var(--dim);margin:2px 0 0}
#weekSrc[hidden]{display:none}
#radarModal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
#radarModal.on{display:flex}
#radarModal .rmap{aspect-ratio:900/846;width:min(96vw,calc(78vh * 900 / 846));border-radius:10px}
#radarModal .rin{top:0;transform:none}
#radarModal .rfb{object-fit:contain}
#radarModal .rmap.fallback .rin{display:none}#radarModal .rmap.fallback .rfb{display:block}
#radarModal .rowb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#radarModal .cap{color:var(--dim);font-size:.75em;margin:8px 0;text-align:center}
#radarModal button{min-width:160px}
/* sponsors + countdowns */
#spBanner{display:none;margin:0;border-radius:0 0 12px 12px;border-radius:12px;background:#d0021b;color:#fff;font-weight:900;padding:6px 8px 6px 12px;
  align-items:center;gap:8px;animation:sppulse 1.2s ease-in-out infinite;border:3px solid #fff}
#spBanner.on{display:flex}
#spBanner .t{flex:1;min-width:0;font-size:.95em;line-height:1.2}
#spBanner button{background:#fff;color:#000;border-color:#fff;min-height:48px;white-space:nowrap}
@keyframes sppulse{0%,100%{box-shadow:0 0 0 0 rgba(255,60,40,.9)}50%{box-shadow:0 0 0 7px rgba(255,60,40,0)}}
@media (prefers-reduced-motion:reduce){#spBanner{animation:none}}
.sptag{display:inline-flex;align-items:center;gap:6px;margin-top:4px;min-height:36px;padding:2px 10px;border-radius:9px;font-size:.72em;font-weight:900;
  background:#123b2a;border:2px solid #2ecc71;color:#d8ffe9;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sptag.due{background:#5a0f06;border-color:var(--warn);color:#fff}
.spinline{display:inline-block;margin-left:6px;padding:0 7px;border-radius:7px;font-size:.72em;font-weight:900;background:#123b2a;border:2px solid #2ecc71;color:#d8ffe9;min-height:0;vertical-align:middle;line-height:1.6}
.studio{font-weight:900;color:#fff;background:#203a5c;border-radius:6px;padding:0 4px}
.spcard{border:3px solid #2ecc71;background:#0e2a1e;border-radius:16px;padding:12px 14px;margin:10px 0}
.spcard.due{border-color:var(--warn);background:#2e0d08}
.spcard .who{font-size:.72em;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#9ff0c4}
.spcard .copy{font-size:1.15em;font-weight:800;margin:4px 0 10px}
.spdone{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:.8em;margin:8px 0;padding:6px 10px;border:1px dashed var(--line);border-radius:12px}
.spdone button{min-height:40px;padding:2px 12px;font-size:.95em}
.tickbtn{width:100%;min-height:64px;font-size:1.15em;background:#2ecc71;color:#06210f;border-color:#2ecc71;display:flex;align-items:center;justify-content:center;gap:10px}
.tickbtn .tbox{width:34px;height:34px;border:3px solid #06210f;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:#fff;font-size:.9em}
.tickbtn.done{background:var(--panel2);color:var(--text);border-color:var(--line)}
.tickbtn.done .tbox{border-color:#2ecc71;color:#2ecc71;background:transparent}
#extras{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
#extras:empty{display:none}
.cdchip,.studiochip{min-height:48px;padding:4px 12px;border-radius:12px;font-weight:900;font-size:.85em;background:var(--panel2);border:2px solid var(--line);display:inline-flex;align-items:center;gap:8px}
.cdchip .n{color:var(--accent)}
.cdchip.today{background:var(--accent);color:#111;border-color:var(--accent)}.cdchip.today .n{color:#111}
.cdchip.out{opacity:.8}
.studiochip{background:#203a5c;border-color:#3d7bd9}
.studiochip .sp{font-size:.8em;background:#123b2a;border:2px solid #2ecc71;border-radius:8px;padding:1px 7px;color:#d8ffe9}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);display:none;align-items:flex-start;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 10px 10px;overflow-y:auto}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:2px solid var(--line);border-radius:16px;max-width:680px;width:100%;padding:14px}
.modal h3{margin:0 0 8px;color:var(--accent)}
.modal label{display:block;font-size:.75em;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 3px}
.modal input[type=text],.modal input[type=time],.modal input[type=date],.modal input[type=url],.modal textarea{width:100%;background:#000;color:var(--text);border:2px solid var(--line);border-radius:10px;padding:10px;min-height:48px;font-size:1em}
.modal textarea{min-height:84px;resize:vertical;font-family:inherit}
.modal .ed{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;background:var(--bg)}
.modal .rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.modal .rowb button{flex:1 1 auto}
.modal .chk{display:flex;align-items:center;gap:10px;font-size:.9em;font-weight:800;min-height:44px;color:var(--text);text-transform:none;letter-spacing:0}
.modal .chk input{width:28px;height:28px;accent-color:#2ecc71}
.modal .danger{background:#3a1410;border-color:var(--warn)}
.modal .log{font-size:.8em;color:var(--dim);max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;white-space:pre-wrap}
.modal .readcopy{font-size:1.35em;font-weight:900;line-height:1.35;margin:8px 0 14px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;background:#fff;color:#000;font-weight:900;border-radius:14px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:10px;box-shadow:0 6px 30px rgba(0,0,0,.6);max-width:94vw}
#toast.on{display:flex}
#toast button{background:#000;color:#fff;border-color:#000;min-height:48px}
@media (max-height:500px) and (orientation:landscape){ #adv.past{display:none} }
/* fly-away top block */
#topFold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .38s cubic-bezier(.4,0,.2,1),opacity .3s ease,transform .38s cubic-bezier(.4,0,.2,1);transform-origin:top}
#topFoldIn{min-height:0;overflow:hidden}
body.flown #topFold{grid-template-rows:0fr;opacity:0;transform:translateY(-24px);pointer-events:none}
body.flown #tabs{padding-top:4px}
body.flown #tabs button{min-height:40px;padding:4px 12px}
body.flown #tabs button .cat{display:none}
#flyBtn{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:55;width:68px;height:68px;min-height:0;padding:0;border-radius:50%;
  font-size:2em;line-height:1;background:var(--accent);color:#111;border:3px solid #111;box-shadow:0 6px 24px rgba(0,0,0,.7)}
body.flown #flyBtn{background:var(--accent2)}
@media (prefers-reduced-motion:reduce){ #topFold{transition:none} }
/* headline ticker */
#tickerWrap{display:flex;align-items:stretch;gap:6px;margin-top:8px}
#ticker{flex:1;min-width:0;overflow:hidden;background:#000;border:2px solid var(--line);border-radius:14px;position:relative;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
#tickerTrack{display:flex;width:max-content;animation:tick var(--tdur,60s) linear infinite;will-change:transform}
#ticker.paused #tickerTrack{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 18px 4px 10px;border:none;border-radius:0;
  background:transparent;font-weight:800;font-size:1em;white-space:nowrap;color:var(--text);border-right:2px solid #222}
.tk .tag{font-size:.62em;font-weight:900;letter-spacing:.08em;padding:3px 7px;border-radius:6px;color:#000;background:#9aa}
.tk.t-ADVISORY{color:#fff;background:#5a0f06}.tk.t-ADVISORY .tag{background:var(--warn);color:#fff}
.t-WEATHER .tag{background:#5cc8ff}.t-SCHOOLS .tag{background:#c59bff}.t-TRAFFIC .tag,.t-ROADS .tag{background:var(--accent)}
.t-LOCAL .tag{background:var(--ok)}.t-NATIONAL .tag{background:#33d6ff}.t-SPORTS .tag{background:#ff9f43}
.t-EVENTS .tag{background:#ff7ab6}.t-FLASHBACK .tag{background:#cfd8dc}.t-WORLD .tag{background:#7ee0c3}
#tickPause{min-width:52px;padding:4px 10px}
#ticker.static{overflow-x:auto;scroll-snap-type:x mandatory;-webkit-mask-image:none;mask-image:none}
#ticker.static #tickerTrack{animation:none}
#ticker.static .tk{scroll-snap-align:start}
#tickerWrap.none{display:none}
.headline{display:inline-block;font-weight:900;color:var(--accent);font-size:1.08em;scroll-margin-top:var(--hdr,200px)}
.subhead{display:inline-block;font-weight:900;color:var(--accent2);letter-spacing:.06em}
.flashhit{animation:flashhit 1.6s ease-out}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const LS = window.localStorage;
const isHttp = /^https?:$/.test(location.protocol);
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let state = { sheet:null, date:null, mode:'latest', source:'', tab:null, clips:[], clipsLoaded:false, clipsText:null };
let blobUrls = [];
let sheetIndex = null; // from sheets.json when hosted: {latest, dates:[{date,main,br,audio,files}]}
async function loadIndex(){
  if(!isHttp) return;
  try{ sheetIndex=await fetchJson('sheets.json'); LS.setItem('hs:index',JSON.stringify(sheetIndex)); }
  catch(e){ try{ sheetIndex=JSON.parse(LS.getItem('hs:index')||'null'); }catch(_){ sheetIndex=null; } }
  const dl=$('#dateList'); dl.innerHTML='';
  if(sheetIndex && sheetIndex.dates) for(const d of sheetIndex.dates){ const o=document.createElement('option'); o.value=d.date; dl.append(o); }
}
function indexEntry(date){ return sheetIndex && sheetIndex.dates ? sheetIndex.dates.find(d=>d.date===date) : undefined; }
function stepDate(from, dir){
  const list = sheetIndex && sheetIndex.dates ? sheetIndex.dates.map(d=>d.date).sort() : null;
  if(list && list.length){
    const next = dir>0 ? list.find(d=>d>from) : [...list].reverse().find(d=>d<from);
    if(next) return next;
    setStatus(dir>0?'That\'s the newest sheet.':'No older sheets online.', false); return null;
  }
  return shiftWeekday(from, dir);
}

/* ---------- small helpers ---------- */
function setStatus(msg, err){ const s=$('#status'); s.textContent=msg||''; s.className=msg?('show'+(err?' err':'')):''; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function nice(s){ if(!s) return 'Latest'; const d=parseYmd(s); return DAYS[d.getDay()]+' '+MONS[d.getMonth()]+' '+d.getDate(); }
function shiftWeekday(s, dir){ const d=parseYmd(s); do{ d.setDate(d.getDate()+dir); }while(d.getDay()===0||d.getDay()===6); return ymd(d); }
function cleanText(t){
  if(t==null) return '';
  t=String(t);
  t=t.replace(/<audio[\s\S]*?(<\/audio>|\/?>)/gi,'');      // embedded players handled separately
  t=t.replace(/<br\s*\/?>/gi,'\n');                         // -br variant
  t=t.replace(/<\/?[a-z][^>]*>/gi,'');                      // any other stray tags
  const ta=document.createElement('textarea'); ta.innerHTML=t; return ta.value; // decode entities
}
// text -> DOM with clickable links, line breaks preserved by CSS
function richText(el, text){
  const re=/(https?:\/\/[^\s<>"')]+)/g; let last=0, m;
  while((m=re.exec(text))){ studioText(el, text.slice(last,m.index));
    const a=document.createElement('a'); a.href=m[1]; a.textContent=m[1]; a.target='_blank'; a.rel='noopener'; el.append(a); last=m.index+m[1].length; }
  studioText(el, text.slice(last));
}
// plain text, but every studio-line number gets highlighted + tagged with its (unread) sponsor
function studioText(el, t){
  const re = (typeof studioRe==='function') ? studioRe() : null;
  if(!re){ el.append(t); return; }
  let last=0, m;
  while((m=re.exec(t))){ el.append(t.slice(last,m.index));
    const n=document.createElement('span'); n.className='studio'; n.textContent=m[0]; el.append(n);
    for(const sp of sponsorsFor('studio-line')){ if(isRead(sp.id)) continue;
      const b=document.createElement('button'); b.className='spinline'; b.textContent=(sp.icon||'⭐')+' '+(sp.short||sp.name); b.title=sp.read; b.onclick=()=>openRead(sp.id); el.append(b); }
    last=m.index+m[0].length; }
  el.append(t.slice(last));
}
// like richText, but marks numbered story headlines ("3) TITLE") and "━━ LOCAL ━━" dividers
function richLines(el, text){
  text.split('\n').forEach((ln,i,arr)=>{
    const h=ln.match(/^\s*(\d+)\)\s+\S/); const sub=ln.match(/^\s*━+\s*(.+?)\s*━+\s*$/);
    if(h){ const sp=document.createElement('span'); sp.className='headline'; sp.dataset.story=h[1]; richText(sp, ln); el.append(sp); }
    else if(sub){ const sp=document.createElement('span'); sp.className='subhead'; sp.textContent=ln; el.append(sp); }
    else richText(el, ln);
    if(i<arr.length-1) el.append('\n');
  });
}
function sheetDate(sheet){
  const u = sheet && sheet.weather && sheet.weather.updated;
  const m = u && String(u).match(/^(\d{4}-\d{2}-\d{2})/); return m?m[1]:null;
}
function isSection(v){ return v && typeof v==='object' && !Array.isArray(v) && ('content' in v || 'title' in v || 'audio' in v); }
function isClipKey(k,v){ return /^clip-/.test(k) || (v && typeof v.audio==='string'); }

/* ---------- clock ---------- */
function tick(){ const d=new Date(); let h=d.getHours(), ap=h<12?'AM':'PM'; h=h%12||12;
  $('#clock').textContent=h+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap; }
setInterval(tick,1000*15); tick();

/* ---------- font size ---------- */
let fs = Number(LS.getItem('hs:fs'))||0;
function applyFs(){ if(fs) document.documentElement.style.setProperty('--fs',fs+'px'); }
applyFs();
$('#fontUp').onclick=()=>{ fs=Math.min(34,(fs||parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||20)+2); LS.setItem('hs:fs',fs); applyFs(); };
$('#fontDown').onclick=()=>{ fs=Math.max(14,(fs||parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||20)-2); LS.setItem('hs:fs',fs); applyFs(); };

/* ---------- IndexedDB for audio blobs ---------- */
const idb = (() => {
  let p=null;
  function open(){ if(!('indexedDB' in window)) return Promise.reject('no idb');
    if(!p) p=new Promise((res,rej)=>{ const r=indexedDB.open('z93-hot-sheet',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('clips');
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    return p; }
  function tx(mode, fn){ return open().then(db=>new Promise((res,rej)=>{ const t=db.transaction('clips',mode); const st=t.objectStore('clips');
    const out=fn(st); t.oncomplete=()=>res(out && out.result); t.onerror=()=>rej(t.error); })); }
  return {
    get:(k)=>tx('readonly',st=>st.get(k)).catch(()=>null),
    put:(k,v)=>tx('readwrite',st=>st.put(v,k)).catch(()=>null),
    prune:(keepDates)=>open().then(db=>new Promise(res=>{ const t=db.transaction('clips','readwrite'); const st=t.objectStore('clips');
      const r=st.openCursor(); r.onsuccess=()=>{ const c=r.result; if(!c) return; if(!keepDates.includes(String(c.key).split('|')[0])) c.delete(); c.continue(); };
      t.oncomplete=res; t.onerror=res; })).catch(()=>{})
  };
})();

function dataUriToBlob(uri){
  const m=String(uri).match(/^data:([^;,]+)?(;base64)?,(.*)$/s); if(!m) return null;
  const mime=m[1]||'audio/mpeg';
  if(m[2]){ const bin=atob(m[3]); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); }
  return new Blob([decodeURIComponent(m[3])],{type:mime});
}
function clipsFromSheet(sheet){
  const out=[];
  for(const [k,v] of Object.entries(sheet||{})){
    if(!isSection(v)) continue;
    let src=v.audio;
    if(!src && typeof v.content==='string'){ const m=v.content.match(/<audio[^>]*\ssrc=["']([^"']+)["']/i); if(m) src=m[1]; }
    if(src) out.push({key:k, title:v.title||k, notes:v.notes||'', src});
  }
  return out;
}
async function storeClips(date, sheet){
  const list=clipsFromSheet(sheet); const res=[];
  for(const c of list){
    let blob=null, url=c.src;
    if(/^data:/.test(c.src)){ blob=dataUriToBlob(c.src); url=null; }
    const rec={title:c.title, notes:c.notes, blob, url};
    if(date) await idb.put(date+'|'+c.key, rec);
    res.push(Object.assign({key:c.key},rec));
  }
  if(date){
    const clipsSec = sheet.clips && sheet.clips.content;
    await idb.put(date+'|__index', {keys:list.map(c=>c.key), clipsText: clipsSec||null});
    idb.prune(keepDatesFor(date));
  }
  return res;
}
function keepDatesFor(date){ // keep the newest few dates of audio only
  const ks=JSON.parse(LS.getItem('hs:audioDates')||'[]').filter(d=>d!==date); ks.unshift(date);
  const keep=ks.slice(0,3); LS.setItem('hs:audioDates',JSON.stringify(keep)); return keep;
}
async function cachedClips(date){
  if(!date) return null;
  const idx=await idb.get(date+'|__index'); if(!idx) return null;
  const out=[]; for(const k of idx.keys){ const r=await idb.get(date+'|'+k); if(r) out.push(Object.assign({key:k},r)); }
  return {clips:out, clipsText:idx.clipsText};
}

/* ---------- loading sheets ---------- */
function fileFor(date, variant){ return date ? (date+'-hot-sheet'+(variant?'-'+variant:'')+'.json') : 'latest-hot-sheet.json'; }
async function fetchJson(name){
  const r=await fetch(name+(name.includes('?')?'':'?t='+Date.now()),{cache:'no-store'});
  if(!r.ok){ const e=new Error('HTTP '+r.status); e.status=r.status; throw e; }
  return r.json();
}
function cacheSheet(key, sheet){
  try{ LS.setItem('hs:sheet:'+(key||'latest'), JSON.stringify(sheet)); }catch(e){}
  const keys=Object.keys(LS).filter(k=>/^hs:sheet:\d{4}-/.test(k)).sort().reverse();
  keys.slice(10).forEach(k=>LS.removeItem(k)); // keep the last 10 days
}
function cachedSheet(date){ try{ const s=LS.getItem('hs:sheet:'+(date||'latest')); return s?JSON.parse(s):null; }catch(e){ return null; } }

async function load(date, opts={}){
  state.mode = date ? 'date' : 'latest';
  setStatus(isHttp?'Loading…':'');
  let sheet=null, src='', err=null;
  const known = date ? indexEntry(date) : true;
  if(isHttp && known!==undefined && !(known && known.main===false)){
    try{ sheet=await fetchJson(fileFor(date)); src='live'; }
    catch(e){ err=e; }
  } else if(isHttp && known===undefined){ err={status:404, message:'not published'}; }
  if(!sheet){
    const c=cachedSheet(date);
    if(c){ sheet=c; src='saved'; }
  }
  if(!sheet){
    showSheet(null, date);
    if(err && err.status===404 && date){
      const d=parseYmd(date).getDay();
      const hint = sheetIndex && sheetIndex.dates && sheetIndex.dates.length ? ' Sheets online: '+sheetIndex.dates.slice(-5).map(x=>nice(x.date)).join(', ')+'.' : '';
      setStatus('No sheet for '+nice(date)+'.'+((d===0||d===6)?' No show on weekends.':' Hot Sheet may not have written one yet.')+hint, true);
    } else if(!isHttp){
      setStatus('Opened straight from a file, so I can\'t fetch the sheet. Tap 📂 (or drag a file in) and pick latest-hot-sheet.json, and the -audio file too for clips.', true);
    } else {
      setStatus('Couldn\'t load the sheet ('+(err?err.message:'unknown')+') and nothing is saved for this day yet.', true);
    }
    return;
  }
  const d = date || sheetDate(sheet);
  if(src==='live'){ cacheSheet(date, sheet); if(!date && d) cacheSheet(d, sheet); }
  state.source=src;
  await showSheet(sheet, d);
  if(src==='saved') setStatus('Offline: showing the saved copy'+(d?' for '+nice(d):'')+'.', false);
  else setStatus('');
}

async function showSheet(sheet, date){
  blobUrls.forEach(u=>URL.revokeObjectURL(u)); blobUrls=[];
  state.sheet=sheet; state.date=date||null; state.clips=[]; state.clipsLoaded=false; state.clipsText=null;
  renderSheetTag();
  if(date) $('#datePick').value=date;
  renderWeather(sheet && sheet.weather);
  renderTicker();
  renderDays();
  refreshSponsorUI();
  if(sheet){
    const inline=clipsFromSheet(sheet);
    if(inline.length){ state.clips=await storeClips(date, sheet); state.clipsLoaded=true; }
    else { const c=await cachedClips(date); if(c && c.clips.length){ state.clips=c.clips; state.clipsLoaded=true; state.clipsText=c.clipsText; } }
  }
  renderTabs(); renderView();
}

async function loadAudioVariant(){
  const date=state.date;
  if(!isHttp){ $('#fileIn').click(); return; }
  if(!date){ setStatus('Need a date to find the audio file.', true); return; }
  setStatus('Loading clips (about 4–5 MB)…');
  try{
    const a=await fetchJson(fileFor(date,'audio'));
    state.clips=await storeClips(date, a); state.clipsLoaded=true;
    state.clipsText = a.clips && a.clips.content || null;
    setStatus(state.clips.length? '' : 'The audio file has no clips in it.', !state.clips.length);
  }catch(e){
    setStatus(e.status===404?'No audio file for '+nice(date)+'.':'Couldn\'t load clips: '+e.message, true);
  }
  renderTabs(); renderView();
}

/* ---------- sponsors (trigger-based reads, one read per sponsor per show) + countdowns ---------- */
const TZ='America/New_York';
function etParts(d=new Date()){
  const o={}; new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',weekday:'short'})
    .formatToParts(d).forEach(p=>o[p.type]=p.value);
  return {date:o.year+'-'+o.month+'-'+o.day, hm:(o.hour==='24'?'00':o.hour)+':'+o.minute, dow:DAYS.indexOf(o.weekday)};
}
const fmtTime=iso=>new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',timeZone:TZ});
const fmtStamp=iso=>new Date(iso).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:TZ})+' ET';
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
function lsGet(k,def){ try{ const v=JSON.parse(LS.getItem(k)); return v==null?def:v; }catch(e){ return def; } }
function lsSet(k,v){ try{ LS.setItem(k,JSON.stringify(v)); }catch(e){} }
function h(tag, attrs={}, ...kids){ const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){ if(k==='on') Object.entries(v).forEach(([ev,fn])=>e.addEventListener(ev,fn)); else if(k in e && k!=='list') e[k]=v; else e.setAttribute(k,v); }
  kids.flat().forEach(c=>{ if(c!=null && c!==false) e.append(c); }); return e; }
// local edits are an overlay on the published defaults: {items:{id: object | null(=removed)}, settings:{}}
function mergeList(defs, ov){ const items=(ov&&ov.items)||{}; const out=[]; const seen=new Set();
  for(const d of defs||[]){ seen.add(d.id); if(items[d.id]===null) continue; out.push(Object.assign({}, d, items[d.id]||{})); }
  for(const [id,o] of Object.entries(items)) if(!seen.has(id) && o) out.push(Object.assign({id}, o));
  return out; }
function diffOverlay(defs, list){ const items={}; const by=Object.fromEntries((defs||[]).map(d=>[d.id,d]));
  for(const o of list){ const d=by[o.id]; if(!d || JSON.stringify(Object.assign({},d,o))!==JSON.stringify(d)) items[o.id]=o; }
  for(const d of defs||[]) if(!list.some(o=>o.id===d.id)) items[d.id]=null;
  return items; }
function download(name, obj){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));
  a.download=name; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); }
let importHandler=null;
$('#importIn').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f||!importHandler) return;
  try{ importHandler(JSON.parse(await f.text()), f.name); }catch(err){ alert('Could not read '+f.name+': '+err.message); } };

/* --- sponsor data --- */
const SP_BUILTIN={deadline:'09:00', showDays:[1,2,3,4,5], studioLine:'231-929-4487', sponsors:[
  {id:'forefront', name:'Forefront Credit Union', short:'Forefront', icon:'💳', read:"Whatever it is you're dreaming about starts with a question that's asked. Forefront.", triggers:['weather'], keywords:[], active:true, logo:''},
  {id:'tvc-airport', name:'Traverse City Airport (TVC)', short:'TVC Airport', icon:'✈️', read:'tvcairport.com studio line', triggers:['studio-line'], keywords:[], active:true, logo:''}]};
let spDefaults=lsGet('hs:spDefaults', SP_BUILTIN);
let spOv=lsGet('hs:spLocal', {items:{}, settings:{}});
let spLog=lsGet('hs:spLog', []);
let reads=lsGet('hs:reads', {});
async function loadSponsorDefaults(){
  if(isHttp){ try{ const j=await fetchJson('sponsors.json'); if(j && Array.isArray(j.sponsors)){ spDefaults=j; lsSet('hs:spDefaults', j); } }catch(e){} }
  refreshSponsorUI();
}
function spSettings(){ const d=spDefaults||{}; return Object.assign({deadline:'09:00', showDays:[1,2,3,4,5], studioLine:'231-929-4487'},
  {deadline:d.deadline, showDays:d.showDays, studioLine:d.studioLine}, ...[spOv.settings||{}].map(o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!=null)))); }
function allSponsors(){ return mergeList(spDefaults.sponsors, spOv); }
function activeSponsors(){ return allSponsors().filter(s=>s.active!==false); }
function sponsorsFor(trigger){ return activeSponsors().filter(s=>(s.triggers||[]).includes(trigger)); }
function studioRe(){ const d=String(spSettings().studioLine||'').replace(/\D/g,''); if(d.length!==10) return null;
  return new RegExp('\\(?'+d.slice(0,3)+'\\)?[-.\\s]?'+d.slice(3,6)+'[-.\\s]?'+d.slice(6)+'(?!\\d)','g'); }
const WEATHER_RE=/\b(weather|forecast|snow\w*|rain\w*|temps?|temperature|advisory|wind ?chill|sleet|storms?|sunny|cloudy)\b/i;
function logSp(what, note){ spLog.unshift({at:new Date().toISOString(), what, note:note||''}); spLog=spLog.slice(0,400); lsSet('hs:spLog', spLog); }
function readKey(){ return etParts().date; }
function readAt(id){ const r=reads[readKey()]; return r && r[id]; }
function isRead(id){ return !!readAt(id); }
function spById(id){ return allSponsors().find(s=>s.id===id); }
function setRead(id, on, quiet){
  const k=readKey(); const sp=spById(id)||{name:id};
  reads[k]=reads[k]||{};
  if(on){ reads[k][id]=new Date().toISOString(); logSp('✅ Read done: '+sp.name+' ('+fmtTime(reads[k][id])+')'); }
  else { delete reads[k][id]; logSp('↩️ Read un-ticked: '+sp.name); }
  const keep=Object.keys(reads).sort().slice(-14); reads=Object.fromEntries(keep.map(x=>[x,reads[x]]));
  lsSet('hs:reads', reads);
  if(on && !quiet) toast((sp.short||sp.name)+' read ✓ '+fmtTime(reads[k][id]), ()=>setRead(id,false,true));
  refreshSponsorUI(true);
}
function overdueList(){ const s=spSettings(); const p=etParts();
  if(!(s.showDays||[]).includes(p.dow) || p.hm < (s.deadline||'09:00')) return [];
  return activeSponsors().filter(sp=>!isRead(sp.id)); }
function isDue(id){ return overdueList().some(s=>s.id===id); }
function tickButton(sp, after){
  const done=isRead(sp.id);
  const b=h('button',{className:'tickbtn'+(done?' done':''), type:'button'}, h('span',{className:'tbox'}, done?'✓':''),
    done ? 'Read today ✓ '+fmtTime(readAt(sp.id))+' · tap to undo' : 'Read today');
  b.setAttribute('aria-pressed', String(done));
  b.onclick=()=>{ setRead(sp.id, !isRead(sp.id)); if(after) after(); };
  return b;
}
function sponsorCardsFor(view, key, text){
  const list=[]; const add=a=>a.forEach(s=>{ if(!list.some(x=>x.id===s.id)) list.push(s); });
  if(key==='vibe' || WEATHER_RE.test(text)) add(sponsorsFor('weather'));
  const re=studioRe(); if(re && re.test(text)) add(sponsorsFor('studio-line'));
  const low=text.toLowerCase(); add(activeSponsors().filter(s=>(s.keywords||[]).some(k=>k && low.includes(String(k).toLowerCase()))));
  for(const sp of list){
    if(isRead(sp.id)){ view.append(h('div',{className:'spdone'}, '✓ '+(sp.short||sp.name)+' read at '+fmtTime(readAt(sp.id)), h('button',{type:'button', on:{click:()=>setRead(sp.id,false)}},'Undo'))); continue; }
    view.append(h('div',{className:'spcard'+(isDue(sp.id)?' due':'')}, h('div',{className:'who'}, (sp.icon||'⭐')+' Sponsor read · '+sp.name+(isDue(sp.id)?' · OVERDUE':'')),
      h('div',{className:'copy'}, sp.read), tickButton(sp)));
  }
}
function openRead(id){ const sp=spById(id); if(!sp) return;
  $('#readTitle').textContent=(sp.icon||'⭐')+' '+sp.name; $('#readCopy').textContent=sp.read;
  const t=$('#readTick'); t.innerHTML=''; t.append(tickButton(sp, ()=>{ if(isRead(sp.id)) setTimeout(()=>$('#readModal').classList.remove('on'),500); else openRead(id); }));
  $('#readModal').classList.add('on'); }
$('#readClose').onclick=()=>$('#readModal').classList.remove('on');
let toastT=null;
function toast(text, undo){ $('#toastText').textContent=text; const u=$('#toastUndo'); u.style.display=undo?'':'none';
  u.onclick=()=>{ $('#toast').classList.remove('on'); if(undo) undo(); }; $('#toast').classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>$('#toast').classList.remove('on'), 10000); }
function renderWxSponsor(){ const box=$('#wxSponsor'); box.innerHTML='';
  if(!state.sheet || !state.sheet.weather) return;
  for(const sp of sponsorsFor('weather')){ if(isRead(sp.id)) continue;
    box.append(h('button',{className:'sptag'+(isDue(sp.id)?' due':''), type:'button', title:sp.read, on:{click:()=>openRead(sp.id)}}, (sp.icon||'⭐')+' '+(sp.short||sp.name)+' · read')); } }
function renderStudio(){ const slot=$('#studioSlot'); slot.innerHTML=''; const line=spSettings().studioLine; if(!line) return;
  const due=sponsorsFor('studio-line').filter(s=>!isRead(s.id));
  slot.append(h('button',{className:'studiochip', type:'button', title:'Studio line', on:{click:()=>{ if(due[0]) openRead(due[0].id); }}},
    '📞 '+line, ...due.map(s=>h('span',{className:'sp'}, (s.icon||'')+' '+s.read)))); }
function renderBanner(){ const due=overdueList(); const b=$('#spBanner');
  if(!due.length){ if(b.classList.contains('on')){ b.classList.remove('on'); setHdr(); } return; }
  $('#spBannerText').textContent='⚠ Sponsor read still due: '+due.map(s=>s.short||s.name).join(', ');
  $('#spBannerBtn').onclick=()=>openRead(due[0].id);
  if(!b.classList.contains('on')){ b.classList.add('on'); setHdr(); } }
let lastEtDate=etParts().date;
function refreshSponsorUI(withView){ renderWxSponsor(); renderStudio(); renderBanner(); renderCountdowns();
  if(withView){ renderTicker(); if(state.sheet){ const y=scrollY; renderView(); window.scrollTo(0,y); } } }
function onNewDay(){ refreshSponsorUI(true); renderDays(); renderSheetTag(); if(typeof renderWeek==='function') renderWeek(); }
setInterval(()=>{ const d=etParts().date; if(d!==lastEtDate){ lastEtDate=d; onNewDay(); } else { renderBanner(); renderCountdowns(); } }, 30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ const d=etParts().date; if(d!==lastEtDate){ lastEtDate=d; onNewDay(); } } });

/* --- sponsors editor --- */
function openSpEditor(){
  let work=clone(allSponsors()); let set=clone(spSettings()); const before=JSON.stringify({work,set});
  const box=$('#spEditor');
  const draw=()=>{ box.innerHTML='';
    // today's reads with undo
    box.append(h('label',{},'Today\'s reads ('+etParts().date+')'));
    for(const sp of activeSponsors()) box.append(h('div',{className:'ed'}, h('div',{style:'font-weight:900'}, (sp.icon||'')+' '+sp.name), tickButton(sp, ()=>draw())));
    box.append(h('label',{},'Read deadline (ET, Mon–Fri). After this an unread sponsor pins a red banner.'),
      h('input',{type:'time', value:set.deadline||'09:00', on:{input:e=>set.deadline=e.target.value}}),
      h('label',{},'Studio line number'),
      h('input',{type:'text', value:set.studioLine||'', on:{input:e=>set.studioLine=e.target.value}}));
    work.forEach((sp,i)=>{
      const trig=t=>h('label',{className:'chk'}, h('input',{type:'checkbox', checked:(sp.triggers||[]).includes(t), on:{change:e=>{ sp.triggers=(sp.triggers||[]).filter(x=>x!==t); if(e.target.checked) sp.triggers.push(t); }}}), t==='weather'?'Weather (weather bar + weather stories)':'Studio line (whenever the number shows)');
      box.append(h('div',{className:'ed'},
        h('label',{},'Sponsor name'), h('input',{type:'text', value:sp.name||'', on:{input:e=>sp.name=e.target.value}}),
        h('label',{},'Short name + icon'), h('div',{className:'row', style:'flex-wrap:nowrap'},
          h('input',{type:'text', value:sp.short||'', on:{input:e=>sp.short=e.target.value}}),
          h('input',{type:'text', value:sp.icon||'', style:'max-width:80px', on:{input:e=>sp.icon=e.target.value}})),
        h('label',{},'Read line'), h('textarea',{value:sp.read||'', on:{input:e=>sp.read=e.target.value}}),
        h('label',{},'Triggers'), trig('weather'), trig('studio-line'),
        h('label',{},'Keywords (comma separated, optional)'), h('input',{type:'text', value:(sp.keywords||[]).join(', '), on:{input:e=>sp.keywords=e.target.value.split(',').map(x=>x.trim()).filter(Boolean)}}),
        h('label',{},'Logo URL (optional)'), h('input',{type:'url', value:sp.logo||'', on:{input:e=>sp.logo=e.target.value}}),
        h('label',{className:'chk'}, h('input',{type:'checkbox', checked:sp.active!==false, on:{change:e=>sp.active=e.target.checked}}), 'Active'),
        h('div',{className:'rowb'}, h('button',{type:'button', className:'danger', on:{click:()=>{ if(confirm('Remove '+(sp.name||'this sponsor')+'?')){ work.splice(i,1); draw(); } }}}, '🗑 Remove'))));
    });
    const note=h('input',{type:'text', placeholder:'Optional note for the change log'});
    box.append(h('div',{className:'rowb'}, h('button',{type:'button', on:{click:()=>{ work.push({id:'sp-'+uid(), name:'New sponsor', short:'', icon:'⭐', read:'', triggers:[], keywords:[], active:true, logo:''}); draw(); }}}, '➕ Add sponsor')),
      h('label',{},'Note'), note,
      h('div',{className:'rowb'},
        h('button',{type:'button', style:'background:#2ecc71;color:#06210f;border-color:#2ecc71', on:{click:()=>{ saveSp(work,set,note.value); $('#spModal').classList.remove('on'); }}}, '💾 Save'),
        h('button',{type:'button', on:{click:()=>$('#spModal').classList.remove('on')}}, 'Cancel')),
      h('div',{className:'rowb'},
        h('button',{type:'button', on:{click:()=>download('sponsors.json', Object.assign({version:1, exported:new Date().toISOString(), timezone:TZ}, spSettings(), {sponsors:allSponsors(), log:spLog}))}}, '⬇ Export'),
        h('button',{type:'button', on:{click:()=>{ importHandler=(j,name)=>{ if(!Array.isArray(j.sponsors)) throw new Error('no "sponsors" list');
            spOv={items:diffOverlay(spDefaults.sponsors, j.sponsors), settings:{deadline:j.deadline, studioLine:j.studioLine, showDays:j.showDays}}; lsSet('hs:spLocal', spOv);
            logSp('Imported sponsors from '+name); refreshSponsorUI(true); openSpEditor(); }; $('#importIn').click(); }}}, '⬆ Import'),
        h('button',{type:'button', className:'danger', on:{click:()=>{ if(confirm('Drop local sponsor edits and go back to the published defaults? (Read ticks and the log are kept.)')){ spOv={items:{},settings:{}}; lsSet('hs:spLocal',spOv); logSp('Reset sponsors to published defaults'); refreshSponsorUI(true); openSpEditor(); } }}}, '↺ Defaults')),
      h('label',{},'Change log'), h('div',{className:'log'}, spLog.length? spLog.map(l=>fmtStamp(l.at)+' · '+l.what+(l.note?' ('+l.note+')':'')).join('\n') : 'No changes yet.'));
  };
  const saveSp=(list,st,note)=>{ const old=allSponsors(); const oldS=spSettings(); const changes=[];
    for(const o of list){ const p=old.find(x=>x.id===o.id); if(!p){ changes.push('Added sponsor '+o.name); continue; }
      const f=['name','short','icon','read','triggers','keywords','active','logo'].filter(k=>JSON.stringify(p[k])!==JSON.stringify(o[k]));
      if(f.length) changes.push('Edited '+o.name+': '+f.map(k=>k==='read'?'read line':k).join(', ')+(f.includes('read')?' → "'+o.read+'"':'')); }
    for(const p of old) if(!list.some(o=>o.id===p.id)) changes.push('Removed sponsor '+p.name);
    if(st.deadline!==oldS.deadline) changes.push('Deadline '+oldS.deadline+' → '+st.deadline);
    if(st.studioLine!==oldS.studioLine) changes.push('Studio line '+oldS.studioLine+' → '+st.studioLine);
    spOv={items:diffOverlay(spDefaults.sponsors, list), settings:{deadline:st.deadline, studioLine:st.studioLine}}; lsSet('hs:spLocal', spOv);
    (changes.length?changes:['Saved (no changes)']).forEach(c=>logSp(c, note));
    refreshSponsorUI(true); };
  draw(); $('#spModal').classList.add('on');
}
$('#spEditBtn').onclick=openSpEditor;

const CD_BUILTIN={countdowns:[{id:'gta6', name:'GTA 6', emoji:'🎮', when:'2026-11-19T00:00', note:'Grand Theft Auto VI, PS5 and Xbox Series X|S, midnight local time', source:'https://www.rockstargames.com/VI/pre-load-now'}]};
let cdDefaults=lsGet('hs:cdDefaults', CD_BUILTIN);
let cdOv=lsGet('hs:cdLocal', {items:{}});
let cdLog=lsGet('hs:cdLog', []);
async function loadCountdownDefaults(){
  if(isHttp){ try{ const j=await fetchJson('countdowns.json'); if(j && Array.isArray(j.countdowns)){ cdDefaults=j; lsSet('hs:cdDefaults', j); } }catch(e){} }
  renderCountdowns(); }
function allCountdowns(){ return mergeList(cdDefaults.countdowns, cdOv); }
function daysBetween(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/864e5); }
function cdText(c){ const today=etParts().date; const d=String(c.when||'').slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;
  const n=daysBetween(today,d);
  if(n>1) return {cls:'', t:[c.emoji, c.name, 'in'], n:n+' days'};
  if(n===1) return {cls:'', t:[c.emoji, c.name], n:'TOMORROW'};
  if(n===0) return {cls:'today', t:[c.emoji, c.name], n:'TODAY'};
  if(n>=-7) return {cls:'out', t:[c.emoji, c.name], n:'Out now'};
  return null; }
function renderCountdowns(){ const box=$('#countdowns'); if(!box) return; box.innerHTML='';
  for(const c of allCountdowns()){ const x=cdText(c); if(!x) continue;
    box.append(h('button',{className:'cdchip '+x.cls, type:'button', title:(c.note||c.name)+(c.when?' · '+c.when.replace('T',' '):''), on:{click:openCdEditor}},
      x.t.filter(Boolean).join(' ')+' ', h('span',{className:'n'}, x.n))); } }
function logCd(what,note){ cdLog.unshift({at:new Date().toISOString(), what, note:note||''}); cdLog=cdLog.slice(0,300); lsSet('hs:cdLog', cdLog); }
function openCdEditor(){
  let work=clone(allCountdowns()); const box=$('#cdEditor');
  const draw=()=>{ box.innerHTML='';
    work.forEach((c,i)=>{ const [d,t]=String(c.when||'').split('T');
      box.append(h('div',{className:'ed'},
        h('label',{},'Name'), h('input',{type:'text', value:c.name||'', on:{input:e=>c.name=e.target.value}}),
        h('label',{},'Date and time (time optional)'), h('div',{className:'row', style:'flex-wrap:nowrap'},
          h('input',{type:'date', value:d||'', on:{input:e=>{ const tt=String(c.when||'').split('T')[1]; c.when=e.target.value+(tt?'T'+tt:''); }}}),
          h('input',{type:'time', value:(t||'').slice(0,5), on:{input:e=>{ const dd=String(c.when||'').split('T')[0]; c.when=dd+(e.target.value?'T'+e.target.value:''); }}})),
        h('label',{},'Emoji (optional)'), h('input',{type:'text', value:c.emoji||'', style:'max-width:120px', on:{input:e=>c.emoji=e.target.value}}),
        h('label',{},'Note (optional)'), h('input',{type:'text', value:c.note||'', on:{input:e=>c.note=e.target.value}}),
        h('div',{className:'rowb'}, h('button',{type:'button', className:'danger', on:{click:()=>{ if(confirm('Remove '+(c.name||'this countdown')+'?')){ work.splice(i,1); draw(); } }}}, '🗑 Remove'))));
    });
    const note=h('input',{type:'text', placeholder:'Optional note for the change log'});
    box.append(h('div',{className:'rowb'}, h('button',{type:'button', on:{click:()=>{ work.push({id:'cd-'+uid(), name:'', emoji:'⏳', when:etParts().date}); draw(); }}}, '➕ Add countdown')),
      h('label',{},'Note'), note,
      h('div',{className:'rowb'},
        h('button',{type:'button', style:'background:#2ecc71;color:#06210f;border-color:#2ecc71', on:{click:()=>{
          const old=allCountdowns(); const ch=[];
          for(const c of work){ const p=old.find(x=>x.id===c.id); if(!p) ch.push('Added '+(c.name||'countdown')+' ('+c.when+')'); else if(JSON.stringify(p)!==JSON.stringify(Object.assign({},p,c))) ch.push('Edited '+c.name+(p.when!==c.when?': '+p.when+' → '+c.when:'')); }
          for(const p of old) if(!work.some(c=>c.id===p.id)) ch.push('Removed '+p.name);
          cdOv={items:diffOverlay(cdDefaults.countdowns, work.filter(c=>c.name && c.when))}; lsSet('hs:cdLocal', cdOv);
          (ch.length?ch:['Saved (no changes)']).forEach(c=>logCd(c, note.value)); renderCountdowns(); $('#cdModal').classList.remove('on'); }}}, '💾 Save'),
        h('button',{type:'button', on:{click:()=>$('#cdModal').classList.remove('on')}}, 'Cancel')),
      h('div',{className:'rowb'},
        h('button',{type:'button', on:{click:()=>download('countdowns.json',{version:1, exported:new Date().toISOString(), countdowns:allCountdowns(), log:cdLog})}}, '⬇ Export'),
        h('button',{type:'button', on:{click:()=>{ importHandler=(j,name)=>{ if(!Array.isArray(j.countdowns)) throw new Error('no "countdowns" list');
            cdOv={items:diffOverlay(cdDefaults.countdowns, j.countdowns)}; lsSet('hs:cdLocal', cdOv); logCd('Imported countdowns from '+name); renderCountdowns(); openCdEditor(); }; $('#importIn').click(); }}}, '⬆ Import'),
        h('button',{type:'button', className:'danger', on:{click:()=>{ if(confirm('Drop local countdown edits and go back to the published defaults?')){ cdOv={items:{}}; lsSet('hs:cdLocal',cdOv); logCd('Reset countdowns to defaults'); renderCountdowns(); openCdEditor(); } }}}, '↺ Defaults')),
      h('label',{},'Change log'), h('div',{className:'log'}, cdLog.length? cdLog.map(l=>fmtStamp(l.at)+' · '+l.what+(l.note?' ('+l.note+')':'')).join('\n') : 'No changes yet.'));
  };
  draw(); $('#cdModal').classList.add('on'); }

/* ---------- days of note (notable observances) ---------- */
let daysData=null; try{ daysData=JSON.parse(LS.getItem('hs:days')||'null'); }catch(e){}
const FULLDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
async function loadDays(){
  if(isHttp){ try{ const j=await fetchJson('days.json'); if(j && j.dates){ daysData=j; try{ LS.setItem('hs:days',JSON.stringify(j)); }catch(e){} } }catch(e){} }
  renderDays();
}
function daysFor(date){
  // a sheet may carry its own "days" list (strings or {name, what, why, angle, source, icon, kind}); it wins for that sheet's date
  const sd = state.sheet && Array.isArray(state.sheet.days) ? state.sheet.days : null;
  if(sd && sd.length) return sd.map(x=> typeof x==='string' ? {name:x} : x).filter(x=>x && x.name);
  if(!daysData || !daysData.dates || !date) return [];
  return (daysData.dates[date]||[]).map(e=>Object.assign({}, e, (daysData.info||{})[e.key]||{}));
}
/* Live date: the header chip is always today's real date (device clock, Eastern time) and
   ticks over at midnight on its own. Days of note follow today when viewing Latest, or the
   picked date when he steps to another day (then they get a small date prefix). */
function todayET(){ return etParts().date; }
function renderSheetTag(){
  const lab=$('#dateLabel'); lab.textContent = state.mode==='latest' ? 'Latest' : nice(state.date);
  if(!state.date) return;
  const old = state.date!==todayET();
  const t=document.createElement('span'); t.className='sheettag'+(old?' old':'');
  t.textContent = old ? 'Sheet: '+nice(state.date) : 'Sheet: today';
  t.title = old ? 'The loaded sheet is from '+nice(state.date)+', not today' : 'Today\'s sheet';
  lab.append(t);
}
function renderDays(){
  const today = todayET();
  const date = (state.mode==='latest' || !state.date) ? today : state.date;
  const wide=!matchMedia('(max-width:520px)').matches;
  const td=parseYmd(today);
  $('#dowLabel').textContent=(wide?FULLDAYS[td.getDay()]:DAYS[td.getDay()])+', '+MONS[td.getMonth()]+' '+td.getDate();
  $('#dowLabel').title='Today (live clock)';
  const box=$('#dayChips'); box.innerHTML='';
  if(date!==today && daysFor(date).length){ const f=document.createElement('span'); f.className='forday'; f.textContent=nice(date)+':'; box.append(f); }
  const list=daysFor(date);
  if(!wide && list.length>1){   // phone: one compact chip for several days, tap opens them all
    const b=document.createElement('button'); b.className='daychip';
    b.textContent=list.map(x=>x.icon||'•').join('')+' '+list.length+' days'; b.title=list.map(x=>x.name).join(' · ');
    b.setAttribute('aria-label',list.length+' days of note: '+list.map(x=>x.name).join(', '));
    b.onclick=()=>openDay(date,-1); box.append(b); return;
  }
  list.forEach((x,i)=>{
    const b=document.createElement('button'); b.className='daychip k-'+(/federal/i.test(x.kind||'')?'federal':/\bUN\b/.test(x.kind||'')?'un':'other');
    b.textContent=(x.icon?x.icon+' ':'')+x.name; b.title=x.what||x.name; b.setAttribute('aria-label',x.name+', more info');
    b.onclick=()=>openDay(date,i); box.append(b);
  });
}
function openDay(date, idx){
  const list=daysFor(date); const d=parseYmd(date);
  $('#dayModalTitle').textContent='Days of note · '+FULLDAYS[d.getDay()]+', '+MONS[d.getMonth()]+' '+d.getDate();
  const wrap=$('#dayCards'); wrap.innerHTML='';
  list.forEach((x,i)=>{
    const c=document.createElement('div'); c.className='daycard'+(i===idx?' hit':'');

function iconFor(text, daytime=true){
  const t=String(text||'').toLowerCase();
  if(/thunder|t-storm|tstorm/.test(t)) return 'storm';
  if(/snow|flurr|blizzard/.test(t) && /rain|sleet|freezing|drizzle/.test(t)) return 'mix';
  if(/sleet|freezing|ice pellets|wintry/.test(t)) return 'mix';
  if(/snow|flurr|blizzard/.test(t)) return 'snow';
  if(/rain|shower|drizzle/.test(t)) return 'rain';
  if(/fog|haze|smoke|mist/.test(t)) return 'fog';
  if(/wind|breezy|blustery|gust/.test(t)) return 'wind';
  if(/mostly cloudy|overcast|^cloudy|\bcloudy$/.test(t) && !/partly/.test(t)) return 'cloudy';
  if(/mostly sunny|mostly clear/.test(t)) return daytime?'sunny':'clear-night';
  if(/partly|few clouds/.test(t)) return 'partly';
  if(/sunny|clear|fair/.test(t)) return daytime?'sunny':'clear-night';
  return /cloud/.test(t)?'cloudy':(daytime?'sunny':'clear-night');
}
const CLOUD=(fill,dx=0,dy=0)=>`<g transform="translate(${dx} ${dy})" fill="${fill}"><circle cx="24" cy="34" r="11"/><circle cx="36" cy="28" r="14"/><circle cx="47" cy="36" r="9"/><rect x="13" y="34" width="43" height="12" rx="6"/></g>`;

  rays+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; }
  return `<g stroke="#ffcc33" stroke-width="3.5" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffcc33"/>`; };
const DROPS=(n,col='#4fb3ff')=>[18,30,42].slice(0,n).map(x=>`<line x1="${x}" y1="50" x2="${x-4}" y2="60" stroke="${col}" stroke-width="3.5" stroke-linecap="round"/>`).join('');

function weekFromPeriods(periods){
  const out=[]; let i=0;
  const dayName=(p)=>{ const n=p.name.toLowerCase(); if(/^(today|this afternoon|this morning)$/.test(n)) return 'Today';
    if(/^(tonight|overnight|this evening)$/.test(n)) return 'Tonight'; return DAYS[new Date(p.startTime).getDay()]; };
  while(i<periods.length && out.length<7){
    const p=periods[i]; const pop=(p.probabilityOfPrecipitation||{}).value;
    if(p.isDaytime){ const n=periods[i+1] && !periods[i+1].isDaytime ? periods[i+1] : null;
      out.push({day:dayName(p), date:p.startTime.slice(0,10), high:p.temperature, low:n?n.temperature:null, short:p.shortForecast, icon:iconFor(p.shortForecast,true), pop});
      i+= n?2:1; }
    else { out.push({day:dayName(p), date:p.startTime.slice(0,10), high:null, low:p.temperature, short:p.shortForecast, icon:iconFor(p.shortForecast,false), pop}); i++; }
  }
  return out;
}

async function fetchLiveWeek(){

    const j=await r.json(); const per=j.properties && j.properties.periods; if(!per||!per.length) return;
    liveWeek={week:weekFromPeriods(per), at:Date.now(), updated:j.properties.updateTime||j.properties.generatedAt||null};

/* ---------- headline ticker ---------- */
const TAGS=['ADVISORY','WEATHER','SCHOOLS','TRAFFIC','ROADS','LOCAL','NATIONAL','WORLD','SPORTS','EVENTS','FLASHBACK'];
function linesOf(sec){ return sec && typeof sec.content==='string' ? cleanText(sec.content).split('\n').map(l=>l.trim()) : []; }
function stripLead(t){ return t.replace(/^[\s•➜\-–—]+/,'').replace(/^(?:[\p{Extended_Pictographic}\uFE0F\u200D]+\s*)+/u,'').trim(); }
function advisoryLive(w){
  const det=(w&&w.advisory_detail)||{}; if(!w||!w.advisory||det.active===false) return false;
  if(det.until){ const u=new Date(det.until); if(!isNaN(u)&&u<new Date()) return false; } return true;
}
function buildTicker(sheet){
  if(!sheet) return [];
  if(Array.isArray(sheet.ticker) && sheet.ticker.length){   // curated by Hot Sheet: overrides auto items
    return sheet.ticker.map(t=> typeof t==='string' ? {tag:'', text:t} :
      {tag:String(t.tag||'').toUpperCase(), text:String(t.text||''), section:t.section, story:t.story})
      .filter(t=>t.text.trim());
  }
  const out=[]; const w=sheet.weather||{}; const vibe=sheet.vibe;
  const vl=linesOf(vibe);
  // advisories first: live one from the weather block, else the one written in Vibe Check
  if(advisoryLive(w)) out.push({tag:'ADVISORY', text:w.advisory, section:'vibe'});
  else { const a=vl.find(l=>/\b(ADVISORY|WARNING|WATCH)\b/.test(l) && !/^(?:🏫|🚗)/u.test(l));
         if(a) out.push({tag:'ADVISORY', text:stripLead(a), section:'vibe'}); }
  if(w.temp||w.cond){ const ws=(typeof sponsorsFor==='function'?sponsorsFor('weather'):[]).filter(x=>!isRead(x.id)).map(x=>(x.icon||'')+' '+(x.short||x.name));
    out.push({tag:'WEATHER', text:[w.temp,w.cond].filter(Boolean).join(' ')+(w.high?' · High '+w.high:'')+(w.low?' · Low '+w.low:'')+(ws.length?' · '+ws.join(' · '):''), section:'vibe'}); }
  for(const l of vl){
    const m=l.match(/SCHOOLS?\s*:\s*(.+)/i); if(m && m[1].trim()) out.push({tag:'SCHOOLS', text:m[1].trim(), section:'vibe'});
    const r=l.match(/(?:ROADS?|TRAFFIC)\s*:\s*(.+)/i); if(r && r[1].trim()) out.push({tag:'ROADS', text:r[1].trim(), section:'vibe'});
  }
  if(w.traffic && !out.some(o=>o.text===w.traffic)) out.push({tag:'TRAFFIC', text:w.traffic, section:'vibe'});
  // Daily Buzz: numbered story headlines, tagged by the ━━ LOCAL / NATIONAL ━━ divider they sit under
  let group='', sports=[];
  for(const l of linesOf(sheet.buzz)){
    const sub=l.match(/^━+\s*(.+?)\s*━+$/); if(sub){ group=sub[1].toUpperCase(); continue; }
    const h=l.match(/^(\d+)\)\s+(.+)$/);
    if(h){ out.push({tag: TAGS.includes(group)?group:(group||'BUZZ'), text:h[2].replace(/\s*🔊\s*$/u,'').trim(), section:'buzz', story:h[1], clip:/🔊/u.test(h[2])}); continue; }
    if(group==='SPORTS' && /^•/.test(l)){ const t=stripLead(l); if(t) sports.push({tag:'SPORTS', text:t, section:'buzz'}); }
  }
  // Events happening today/tonight
  for(const l of linesOf(sheet.events)){ if(/^•\s*(TODAY|TONIGHT)\b/i.test(l)){ const t=stripLead(l);
    const key=x=>(x.split(/:\s+/)[1]||x).trim().toLowerCase().split(/[\s(,]+/)[0];  // first word after the time, e.g. "kingsley"
    if(!sports.some(s=>key(s.text)===key(t))) out.push({tag:'EVENTS', text:t, section:'events'}); } }
  out.push(...sports);
  const fl=cleanText(sheet.flash&&sheet.flash.content).trim();
  if(fl){ const first=fl.split(/(?<=\d{4}\.)\s|\n/)[0].trim(); out.push({tag:'FLASHBACK', text:first.replace(/\.$/,''), section:'flash'}); }
  // de-dupe, drop empties
  const seen=new Set(); return out.filter(o=>o.text && !seen.has(o.tag+o.text) && seen.add(o.tag+o.text));
}

$('#ticker').addEventListener('click',e=>{
  const b=e.target.closest('.tk'); if(!b || held){ held=false; return; }
  const it=(state.tickerItems||[])[+b.dataset.i]; if(it) jumpTo(it.section, it.story);
});
function jumpTo(section, story){
  if(section && sectionList().some(x=>x.key===section)){ state.tab=section; LS.setItem('hs:tab',section); renderTabs(); renderView(); }
  const el = story ? document.querySelector('#view .headline[data-story="'+story+'"]') : null;
  if(el){ window.scrollTo({top: Math.max(0, el.getBoundingClientRect().top + scrollY - stickyH() - 10), behavior: reduceMotion.matches?'auto':'smooth'}); el.classList.remove('flashhit'); void el.offsetWidth; el.classList.add('flashhit'); }
  else { const h=document.querySelector('#view h2'); if(h){ window.scrollTo({top: Math.max(0, h.getBoundingClientRect().top + scrollY - stickyH() - 8)}); } }
}
// sticky stack: overdue banner (always) + top block (only while it fits in ~45% of the screen, or when flown) + tabs bar
function setHdr(){
  const root=document.documentElement.style, top=$('#top'), ban=$('#spBanner');
  const bH = ban.classList.contains('on') ? ban.offsetHeight : 0;
  const hH = top.offsetHeight;
  const pinned = document.body.classList.contains('flown') || hH <= innerHeight*0.45;
  top.classList.toggle('pinned', pinned);
  root.setProperty('--bH', bH+'px'); root.setProperty('--pinH', (pinned?hH:0)+'px');
  root.setProperty('--hdr', (stickyH()+10)+'px');
}
function stickyH(){ const ban=$('#spBanner'); return (ban.classList.contains('on')?ban.offsetHeight:0) + ($('#top').classList.contains('pinned')?$('#top').offsetHeight:0) + $('#tabsBar').offsetHeight; }
addEventListener('resize', setHdr); addEventListener('orientationchange', ()=>setTimeout(setHdr,300));
if('ResizeObserver' in window){ const ro=new ResizeObserver(()=>setHdr()); ro.observe($('#top')); ro.observe($('#spBanner')); }
reduceMotion.addEventListener && reduceMotion.addEventListener('change', renderTicker);

/* ---------- render ---------- */
function renderWeather(w){
  w=w||{};
  $('#wxTemp').textContent=w.temp||'--';
  $('#wxIcon').innerHTML = (w.temp||w.cond) ? svgIcon(w.icon||iconFor(w.cond, true), w.cond) : '';
  if(typeof renderWeek==='function') renderWeek();
  $('#wxCond').textContent=w.cond||'No weather yet';
  const more=[]; if(w.high||w.low) more.push('Hi '+(w.high||'–')+' / Lo '+(w.low||'–'));
  if(w.tonight) more.push('Tonight: '+w.tonight);
  if(w.updated){ const t=new Date(w.updated); if(!isNaN(t)) more.push('Updated '+t.toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})); }
  $('#wxMore').textContent=more.join(' · '); state.wxMore=more.join(' · ');
  const adv=$('#adv'); const det=w.advisory_detail||{};
  adv.className=''; adv.textContent='';
  if(w.advisory){
    let past=false; if(det.until){ const u=new Date(det.until); past=!isNaN(u)&&u<new Date(); }
    if(det.active===false) past=true;
    adv.textContent=(past?'Expired: ':'⚠ ')+w.advisory+(det.areas?' · '+det.areas:'');
    adv.title=det.headline||'';
    adv.className=past?'past':'on';
  }
  $('#traffic').textContent = w.traffic ? '🚗 '+w.traffic : '';
}

function sectionList(){
  const s=state.sheet||{}; const out=[];
  for(const [k,v] of Object.entries(s)){
    if(k==='weather' || !isSection(v) || isClipKey(k,v)) continue;
    out.push({key:k, v});
  }
  // a Clips tab even if the base sheet has no "clips" section but audio exists
  if(!out.find(x=>x.key==='clips') && state.clips.length) out.push({key:'clips', v:{title:'Audio Clips', category:'', content:''}});
  return out;
}
function renderTabs(){
  const nav=$('#tabs'); nav.innerHTML='';
  const list=sectionList();
  if(!list.length) return;
  const saved=LS.getItem('hs:tab');
  if(!state.tab || !list.find(x=>x.key===state.tab)) state.tab = list.find(x=>x.key===saved) ? saved : list[0].key;
  for(const {key,v} of list){
    const b=document.createElement('button'); b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(key===state.tab));
    const empty=!cleanText(v.content).trim() && key!=='clips';
    if(empty) b.classList.add('empty');
    b.append(v.title||key);
    if(v.category){ const c=document.createElement('span'); c.className='cat'; c.textContent=v.category; b.append(c); }
    b.onclick=()=>{ state.tab=key; LS.setItem('hs:tab',key); renderTabs(); renderView(); window.scrollTo({top:0}); };
    nav.append(b);
    if(key===state.tab) setTimeout(()=>{ const l=b.offsetLeft, r=l+b.offsetWidth; if(l<nav.scrollLeft) nav.scrollLeft=l-8; else if(r>nav.scrollLeft+nav.clientWidth) nav.scrollLeft=r-nav.clientWidth+8; },0);
  }
}
function renderView(){
  const view=$('#view'); view.innerHTML='';
  if(!state.sheet){
    const p=document.createElement('p'); p.className='hint';
    p.textContent='No sheet loaded. Use Latest, pick a date, or open a JSON file with 📂.'; view.append(p); return;
  }
  const item=sectionList().find(x=>x.key===state.tab); if(!item) return;
  const v=item.v;
  if(state.wxMore && matchMedia('(max-width:520px)').matches && !document.body.classList.contains('flown')){ const w=document.createElement('div'); w.className='hint'; w.style.marginBottom='8px'; w.textContent='🌡 '+state.wxMore; view.append(w); }
  if(v.category){ const c=document.createElement('div'); c.className='catline'; c.textContent=v.category; view.append(c); }
  const h=document.createElement('h2'); h.textContent=v.title||item.key; view.append(h);

  sponsorCardsFor(view, item.key, cleanText(v.content));
  if(item.key==='clips') renderClips(view, v);
  else {
    const txt=cleanText(v.content).trim();
    const c=document.createElement('div'); c.className='content'+(txt?'':' empty');
    if(txt) richLines(c, txt); else c.textContent='Nothing in this section today.';
    view.append(c);
  }
  if(v.notes){
    const d=document.createElement('details'); d.className='notes'; d.open = !cleanText(v.content).trim() && item.key!=='clips';
    const s=document.createElement('summary'); s.textContent='Notes & credits'; d.append(s);
    const div=document.createElement('div'); richText(div, cleanText(v.notes)); d.append(div); view.append(d);
  }
}
function renderClips(view, v){
  const text = cleanText(state.clipsText || v.content).trim();
  const ie = indexEntry(state.date);
  if(state.clipsLoaded && state.clips.length){
    for(const c of state.clips) view.append(makePlayer(c.title, c.blob?blobUrl(c.blob):c.url, c.notes));
  } else if(ie && !ie.audio){
    const n=document.createElement('div'); n.className='content empty'; n.textContent='No app audio online for this day.'; view.append(n);
  } else {
    const b=document.createElement('button'); b.className='loadclips';
    b.textContent = isHttp ? '🔊 Load today\'s clips (about 4–5 MB)' : '🔊 Open the -audio JSON file for clips';
    b.onclick=loadAudioVariant; view.append(b);
  }
  // full-quality files named in the clip sheet, served from ./clips/<date>/
  let files=[...new Set((text.match(/[\w.-]+\.(?:mp3|m4a|wav|aac|ogg)\b/gi)||[]))];
  if(ie) files = ie.files || [];   // hosted: only files that were actually published
  if(isHttp && state.date && files.length){
    const d=document.createElement('details'); d.className='notes';
    const s=document.createElement('summary'); s.textContent='Full-quality MP3s ('+files.length+')'; d.append(s);
    const box=document.createElement('div'); box.style.whiteSpace='normal';
    for(const f of files) box.append(makePlayer(f, 'clips/'+state.date+'/'+f, '', true));
    d.append(box); view.append(d);
  }
  if(text){ const c=document.createElement('div'); c.className='content'; richText(c, text); view.append(c); }
}
function blobUrl(b){ const u=URL.createObjectURL(b); blobUrls.push(u); return u; }
function fmt(t){ if(!isFinite(t)) return '--:--'; t=Math.floor(t); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
let current=null;
function makePlayer(title, src, notes, lazy){
  const w=document.createElement('div'); w.className='player';
  const t=document.createElement('div'); t.className='ptitle'; t.textContent=title; w.append(t);
  const a=document.createElement('audio'); a.preload=lazy?'none':'metadata'; a.src=src; w.append(a);
  const row=document.createElement('div'); row.className='prow';
  const pp=document.createElement('button'); pp.className='pp'; pp.textContent='▶'; pp.setAttribute('aria-label','Play '+title);
  const bar=document.createElement('div'); bar.className='bar';
  const rng=document.createElement('input'); rng.type='range'; rng.min=0; rng.max=1000; rng.value=0; rng.setAttribute('aria-label','Seek');
  const tm=document.createElement('div'); tm.className='time'; tm.textContent='0:00 / --:--';
  bar.append(rng,tm);
  const stop=document.createElement('button'); stop.className='stop'; stop.textContent='■'; stop.setAttribute('aria-label','Stop and rewind');
  row.append(pp,bar,stop); w.append(row);
  if(notes){ const n=document.createElement('div'); n.className='pnote'; richText(n, cleanText(notes)); w.append(n); }
  const upd=()=>{ tm.textContent=fmt(a.currentTime)+' / '+fmt(a.duration); if(a.duration) rng.value=Math.round(a.currentTime/a.duration*1000); };
  a.addEventListener('timeupdate',upd); a.addEventListener('loadedmetadata',upd);
  a.addEventListener('play',()=>{ if(current&&current!==a) current.pause(); current=a; w.classList.add('playing'); pp.textContent='❚❚'; });
  a.addEventListener('pause',()=>{ w.classList.remove('playing'); pp.textContent='▶'; });
  a.addEventListener('ended',()=>{ a.currentTime=0; upd(); });
  a.addEventListener('error',()=>{ tm.textContent='Can\'t play this file here'; });
  pp.onclick=()=>{ a.paused ? a.play().catch(e=>{ tm.textContent='Play blocked: '+e.message; }) : a.pause(); };
  stop.onclick=()=>{ a.pause(); a.currentTime=0; upd(); };
  rng.oninput=()=>{ if(a.duration) a.currentTime=rng.value/1000*a.duration; };
  return w;
}

/* ---------- local files (picker + drag/drop) ---------- */
async function openFiles(files){
  const parsed=[];
  for(const f of files){
    try{ const j=JSON.parse(await f.text());
      parsed.push({j, nameDate:(f.name.match(/(\d{4}-\d{2}-\d{2})/)||[])[1], hasAudio:clipsFromSheet(j).length>0}); }
    catch(e){ setStatus('Couldn\'t read '+f.name+': '+e.message, true); return; }
  }
  const audio=parsed.find(x=>x.hasAudio); const plain=parsed.find(x=>!x.hasAudio);
  const addAudio=async(date)=>{ state.clips=await storeClips(date, audio.j); state.clipsLoaded=true;
    state.clipsText=audio.j.clips&&audio.j.clips.content||null; };
  // only the audio file picked while a sheet is already showing: just add the clips
  if(!plain && audio && state.sheet && (!audio.nameDate || audio.nameDate===state.date)){
    await addAudio(state.date); state.tab='clips'; renderTabs(); renderView(); setStatus(''); return;
  }
  const base=plain||audio; if(!base) return;
  const date=base.nameDate||sheetDate(base.j);
  state.mode='date'; if(date) cacheSheet(date, base.j);
  await showSheet(base.j, date);
  if(audio && audio!==base){ await addAudio(date); renderTabs(); renderView(); }
  setStatus('Loaded from file'+(date?' · '+nice(date):'')+'.');
}
$('#fileBtn').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{ if(e.target.files.length) openFiles([...e.target.files]); e.target.value=''; };
let dragN=0;
addEventListener('dragenter',e=>{ e.preventDefault(); dragN++; $('#drop').classList.add('on'); });
addEventListener('dragleave',e=>{ if(--dragN<=0){ dragN=0; $('#drop').classList.remove('on'); } });
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{ e.preventDefault(); dragN=0; $('#drop').classList.remove('on'); if(e.dataTransfer.files.length) openFiles([...e.dataTransfer.files]); });

/* ---------- date controls ---------- */
function baseDate(){ return state.date || ymd(new Date()); }
$('#prevDay').onclick=()=>{ const d=stepDate(baseDate(),-1); if(d) load(d); };
$('#nextDay').onclick=()=>{ const d=stepDate(baseDate(),+1); if(d) load(d); };
$('#datePick').onchange=e=>{ if(e.target.value) load(e.target.value); };
$('#latestBtn').onclick=()=>load(null);
$('#refreshBtn').onclick=async()=>{ await loadIndex(); loadDays(); loadSponsorDefaults(); loadCountdownDefaults(); load(state.mode==='latest'?null:state.date); };

/* ---------- PWA ---------- */
if(isHttp && 'serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

loadIndex().then(()=>load(null)); loadDays(); loadSponsorDefaults(); loadCountdownDefaults();
window.__hs = state; // for debugging
})();
</script>
